[project]
name = "pdftablesearch"
version = "0.1.0"
description = "PDF Intelligence Portal — 금융 문서 AI 분석 (Weaviate, LDAP 인증, RAG)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.5",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "langchain>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-core>=0.1.0",
    "langchain-openai>=0.0.5",
    "langchain-text-splitters>=0.0.1",
    "opendataloader-pdf[hybrid]>=2.2.1",
    "chromadb>=0.4.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "sentence-transformers>=2.0.0",
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
    "cryptography>=41.0.0",
    "ldap3>=2.9.0",
    "PyJWT>=2.8.0",
    "weaviate-client>=4.0.0",
]

[project.scripts]
ldap = "pdftablesearch.ldap_server:start"
ldap-stop = "pdftablesearch.ldap_server:stop"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100
