[project]
name = "pdf-intelligence-portal"
version = "0.1.0"
description = "Workspace launcher for PDF Intelligence Portal"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pdftablesearch",
    "pdf-intelligence-web",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
]

[project.scripts]
all = "pdftablesearch.port_utils:run_all"
api = "pdftablesearch.run:main"
killports = "pdftablesearch.port_utils:killports"
pdf-portal = "pdftablesearch.run:main"
qa = "pdftablesearch.qa:main"
ui = "pdf_intelligence_web.cli:dev"
ui-build = "pdf_intelligence_web.cli:build"
ui-lint = "pdf_intelligence_web.cli:lint"
ui-preview = "pdf_intelligence_web.cli:preview"
weaviate = "pdftablesearch.vectorstores.weaviate_server:main"

[tool.uv.workspace]
members = [
    "pdftablesearch",
    "web",
]

[tool.uv.sources]
pdftablesearch = { workspace = true }
pdf-intelligence-web = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["portal_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "weaviate: integration tests that require a local Weaviate server",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
target-version = "py311"
line-length = 100
