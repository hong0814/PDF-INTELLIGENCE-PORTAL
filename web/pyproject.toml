[project]
name = "pdf-intelligence-web"
version = "0.1.0"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
ui = "pdf_intelligence_web.cli:dev"
ui-build = "pdf_intelligence_web.cli:build"
ui-preview = "pdf_intelligence_web.cli:preview"
ui-lint = "pdf_intelligence_web.cli:lint"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pdf_intelligence_web"]
